<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>みのりの輪</title>
<style>
:root{--bg:#f4f8f2;--card:#fff;--tx:#223;--sub:#667;--ac:#2e7d32;--bd:#dde6da}
@media(prefers-color-scheme:dark){:root{--bg:#141a14;--card:#1e271e;--tx:#e8efe6;--sub:#9ab;--ac:#6fcf73;--bd:#2f3d2f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.6}
main{max-width:720px;margin:auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h1{font-size:20px;margin:4px 0}h2{font-size:15px;margin:0 0 8px}
select,input,button{font-size:16px;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
button{background:var(--ac);color:#fff;border:0;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:0}
.big{font-size:40px;font-weight:700;color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.grid b{display:block;font-size:20px}.grid span{font-size:12px;color:var(--sub)}
.warn{background:#fff3cd;color:#664d03;padding:8px;border-radius:8px;margin-bottom:12px;font-size:14px}
.res button{display:block;width:100%;margin-top:6px;text-align:left;background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
svg{width:100%;height:auto;display:block}small{color:var(--sub)}
</style></head><body><main>
<h1>🌱 みのりの輪</h1>
<div id="warn"></div>
<div class="card"><h2>📍 地点</h2>
<div class="row"><select id="preset"></select></div>
<div class="row" style="margin-top:8px"><input id="q" placeholder="地名を検索（例：熊谷）"><button id="sb" style="flex:0 0 auto">検索</button></div>
<div class="res" id="res"></div></div>
<div class="card"><h2 id="dt">読み込み中…</h2>
<div class="grid"><div><b id="tmax">-</b><span>最高気温</span></div><div><b id="tmin">-</b><span>最低気温</span></div><div><b id="pp">-</b><span>降水確率(最大)</span></div></div>
<div class="grid" style="margin-top:10px"><div><b id="vm">-</b><span>VPD平均 kPa</span></div><div><b id="vx">-</b><span>VPD最大 kPa</span></div><div><b id="rd">-</b><span>日射量最大 W/m²</span></div></div></div>
<div class="card"><h2>🌱 植物代謝指数</h2><div><span class="big" id="sc">-</span> / 100　<b id="st"></b></div></div>
<div class="card"><h2>🌱 今日の栽培アドバイス</h2><div id="adv"></div></div>
<div class="card"><h2>📊 今日の環境予想</h2><div id="charts"></div></div>
<small id="upd"></small>
<p><small>予報には不確実性があります。実際の圃場やセンサー値と合わせてご判断ください。データ: Open-Meteo</small></p>
</main>
<script>
const PRESETS=[["宇都宮市",36.5551,139.8828],["東京",35.6895,139.6917],["熊谷市",36.1473,139.3886],["前橋市",36.3895,139.0634],["札幌市",43.0642,141.3469],["仙台市",38.2682,140.8694],["名古屋市",35.1815,136.9066],["大阪市",34.6937,135.5023],["広島市",34.3853,132.4553],["福岡市",33.5904,130.4017],["那覇市",26.2124,127.6809]];
const $=id=>document.getElementById(id);
const W=["日","月","火","水","木","金","土"];
const sget=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const sset=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let loc=sget("mn_loc")||{name:PRESETS[0][0],lat:PRESETS[0][1],lon:PRESETS[0][2]};
function vpd(T,RH){const es=0.6108*Math.exp(17.27*T/(T+237.3));return es-es*RH/100}
const fit=(x,lo,hi,tol)=>x>=lo&&x<=hi?1:Math.max(0,1-(x<lo?lo-x:x-hi)/tol);
const avg=a=>a.reduce((s,x)=>s+x,0)/a.length;
function score(d){const hs=[];for(let h=6;h<=18;h++)hs.push(fit(d.t[h],18,28,12)*.3+fit(d.h[h],50,80,40)*.2+fit(d.v[h],.6,1.2,1.2)*.3+Math.min(1,d.r[h]/500)*.2);return Math.round(avg(hs)*100)}
const label=s=>s>=80?"非常に良好":s>=60?"良好":s>=40?"普通":s>=20?"やや注意":"注意";
function advice(d,s){const a=[],mx=Math.max(...d.v),mn=avg(d.v),pm=Math.max(...d.p),rm=Math.max(...d.r),tm=Math.max(...d.t);
if(tm>=33)a.push("午後は高温になるため、蒸散量の増加と水分不足に注意してください。");
if(mx>1.5)a.push("午後はVPDが高くなるため、蒸散が進みやすい環境です。水分管理に注意してください。");
else if(mn<.4)a.push("湿度が高くVPDが低いため、蒸散が進みにくい環境です。過湿に注意してください。");
if(rm>=600)a.push("日射量が十分に見込まれるため、光合成が進みやすい環境です。");
else if(rm<250)a.push("日射量が少ないため、光合成量が低下する可能性があります。");
if(pm>=60)a.push("降雨の可能性が高いため、灌水量の調整を検討してください。");
if(!a.length)a.push("大きな問題のない穏やかな環境です。通常どおり管理してください。");return a.join("<br>")}
function chart(title,arr,unit,color,fixedMax){const w=360,h=150,L=34,R=8,T=8,B=22;let mn=Math.min(...arr),mx=Math.max(...arr);if(fixedMax!=null){mn=0;mx=fixedMax}if(mx-mn<1e-6)mx=mn+1;const pad=fixedMax!=null?0:(mx-mn)*.1;mn-=pad;mx+=pad;
const X=i=>L+(w-L-R)*i/23,Y=v=>T+(h-T-B)*(1-(v-mn)/(mx-mn));
const pts=arr.map((v,i)=>X(i).toFixed(1)+","+Y(v).toFixed(1)).join(" ");
let g="";for(let k=0;k<=2;k++){const v=mn+(mx-mn)*k/2,y=Y(v);g+=`<line x1="${L}" x2="${w-R}" y1="${y}" y2="${y}" stroke="currentColor" opacity=".15"/><text x="${L-4}" y="${y+4}" font-size="10" text-anchor="end" fill="currentColor" opacity=".7">${v.toFixed(unit==="kPa"?1:0)}</text>`}
for(let i=0;i<24;i+=6)g+=`<text x="${X(i)}" y="${h-6}" font-size="10" text-anchor="middle" fill="currentColor" opacity=".7">${i}:00</text>`;
return `<div style="margin-bottom:10px"><b style="font-size:13px">${title}（${unit}）</b><svg viewBox="0 0 ${w} ${h}">${g}<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5"/></svg></div>`}
function render(data,fromCache,time){
const d=data,s=score(d),[y,m,dd]=d.date.split("-").map(Number),wd=W[new Date(y,m-1,dd).getDay()];
$("dt").textContent=`📅 ${y}年${m}月${dd}日（${wd}）｜${loc.name}`;
$("tmax").textContent=d.tmax.toFixed(1)+"℃";$("tmin").textContent=d.tmin.toFixed(1)+"℃";
$("pp").textContent=Math.max(...d.p)+"%";$("vm").textContent=avg(d.v).toFixed(2);$("vx").textContent=Math.max(...d.v).toFixed(2);$("rd").textContent=Math.round(Math.max(...d.r));
$("sc").textContent=s;$("st").textContent="状態："+label(s);$("adv").innerHTML=advice(d,s);
$("charts").innerHTML=chart("🌡 気温",d.t,"℃","#e53935")+chart("💧 湿度",d.h,"%","#1e88e5",100)+chart("☀️ 日射量",d.r,"W/m²","#fb8c00")+chart("🫧 VPD",d.v,"kPa","#43a047");
$("upd").textContent="最終取得："+time;
$("warn").innerHTML=fromCache?'<div class="warn">⚠ 通信できなかったため、前回保存したデータを表示しています。</div>':"";}
async function load(){
const key="mn_cache_"+loc.lat.toFixed(2)+"_"+loc.lon.toFixed(2);
try{
const u=`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&hourly=temperature_2m,relative_humidity_2m,precipitation_probability,shortwave_radiation&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo&forecast_days=1`;
const r=await fetch(u);if(!r.ok)throw new Error("HTTP "+r.status);const j=await r.json();
const t=j.hourly.temperature_2m.slice(0,24),h=j.hourly.relative_humidity_2m.slice(0,24);
const data={date:j.daily.time[0],tmax:j.daily.temperature_2m_max[0],tmin:j.daily.temperature_2m_min[0],t,h,p:j.hourly.precipitation_probability.slice(0,24).map(x=>x||0),r:j.hourly.shortwave_radiation.slice(0,24).map(x=>x||0),v:t.map((x,i)=>vpd(x,h[i]))};
const time=new Date().toLocaleString("ja-JP",{timeZone:"Asia/Tokyo"});
sset(key,{data,time});render(data,false,time);
}catch(e){console.error("取得失敗",e);const c=sget(key);
if(c)render(c.data,true,c.time);else{$("dt").textContent="データを取得できませんでした";$("warn").innerHTML='<div class="warn">通信状況を確認して、ページを再読み込みしてください。</div>'}}}
function setLoc(n,la,lo){loc={name:n,lat:la,lon:lo};sset("mn_loc",loc);$("res").innerHTML="";syncPreset();load()}
function syncPreset(){const p=$("preset");p.innerHTML=PRESETS.map((x,i)=>`<option value="${i}">${x[0]}</option>`).join("")+'<option value="x">その他（検索した地点）</option>';
const i=PRESETS.findIndex(x=>x[0]===loc.name);p.value=i>=0?i:"x";if(i<0)p.lastElementChild.textContent=loc.name}
$("preset").onchange=e=>{const v=e.target.value;if(v!=="x"){const p=PRESETS[v];setLoc(p[0],p[1],p[2])}};
$("sb").onclick=async()=>{const q=$("q").value.trim();if(!q)return;
try{const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=ja&country_code=JP`);const j=await r.json();
$("res").innerHTML="";(j.results||[]).forEach(x=>{const b=document.createElement("button");b.textContent=`${x.name}（${x.admin1||""}${x.admin2?" "+x.admin2:""}）`;b.onclick=()=>setLoc(x.name,x.latitude,x.longitude);$("res").appendChild(b)});
if(!j.results)$("res").textContent="見つかりませんでした"}catch(e){$("res").textContent="検索できませんでした。通信を確認してください。"}};
syncPreset();load();
</script></body></html>
